[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banking77-distill"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
description = "Measured intent-routing baselines and a reproducible Qwen distillation experiment"
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "scikit-learn==1.6.1", "fastapi==0.115.12",
 "pydantic==2.11.5", "httpx==0.28.1", "uvicorn==0.34.2", "pyarrow==20.0.0",
 "huggingface-hub==0.31.4", "PyYAML==6.0.2", "joblib==1.4.2", "matplotlib==3.10.3"]

[project.optional-dependencies]
train = ["torch==2.6.0", "transformers==4.51.3", "peft==0.15.2", "trl==0.17.0",
 "datasets==3.6.0", "accelerate==1.7.0", "safetensors==0.5.3"]
teacher = ["vllm==0.8.5.post1; sys_platform == 'linux'", "setuptools==80.9.0", "wheel==0.45.1"]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "ruff==0.11.11", "mypy==1.15.0", "types-PyYAML==6.0.12.20250516"]
load = ["locust==2.37.4"]

teacher-eval = ["autoawq==0.2.9", "zstandard==0.23.0"]

[project.scripts]
b77 = "b77.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
